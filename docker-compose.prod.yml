version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsobet-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://neondb_owner:npg_KqEGfwR9Yv5g@ep-spring-violet-av5khtm5.c-11.us-east-1.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=un_secreto_ultra_seguro_para_pulsobet_2026
      - ALLOWED_ORIGINS=*
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "3001"
    depends_on:
      - redis
    networks:
      - pulsobet-network

  redis:
    image: redis:7-alpine
    container_name: pulsobet-redis
    restart: always
    command: redis-server --appendonly yes
    networks:
      - pulsobet-network

  nginx:
    image: nginx:alpine
    container_name: pulsobet-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - pulsobet-network

networks:
  pulsobet-network:
    driver: bridge
