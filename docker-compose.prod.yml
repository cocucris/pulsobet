version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsobet-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=*
      - REDIS_URL=redis://redis:6379
      - UPLOADS_DIR=/app/uploads/cards
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3001"
    depends_on:
      - redis
    networks:
      - pulsobet-network

  redis:
    image: redis:7-alpine
    container_name: pulsobet-redis
    restart: always
    command: redis-server --appendonly yes
    networks:
      - pulsobet-network

  caddy:
    image: caddy:2-alpine
    container_name: pulsobet-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - pulsobet-network

networks:
  pulsobet-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  uploads_data:
